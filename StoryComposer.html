<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Story Composer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background: #eef1f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border: 1px solid #e2e6ec;
      padding: 16px 20px 20px;
    }

    /* PREVIEW — menyesuaikan rasio gambar */
    .preview-section {
      background: #f6f8fa;
      padding: 4px;
      border: 1px solid #e2e6ec;
      margin-bottom: 14px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .story-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16; /* default, akan diubah via JS */
      background: #0e121c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: aspect-ratio 0.2s ease;
    }

    #primaryImg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #secondaryImg {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      max-width: 66%;
      max-height: 42%;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
      background: #0b111e;
      display: none;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.7rem;
      text-align: center;
      padding: 12px;
      z-index: 2;
      pointer-events: none;
      line-height: 1.6;
    }

    .placeholder i {
      display: block;
      font-size: 1.8rem;
      margin-bottom: 6px;
      opacity: 0.35;
      color: #7a8aa3;
    }

    .placeholder small {
      font-size: 0.55rem;
      opacity: 0.5;
      display: block;
    }

    /* RASIO BADGE */
    .ratio-badge {
      display: inline-block;
      background: #2563eb;
      color: white;
      font-size: 0.5rem;
      font-weight: 600;
      padding: 1px 10px;
      border-radius: 4px;
      margin-left: 6px;
      letter-spacing: 0.3px;
    }

    /* IMAGE ROW — tetap 2 kolom */
    .image-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .image-col {
      flex: 1;
      min-width: 0;
      background: #f7f9fb;
      padding: 12px 14px 14px;
      border: 1px solid #e2e6ec;
    }

    .image-col .label {
      font-weight: 600;
      color: #0a0a0f;
      font-size: 0.8rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .image-col .label i {
      color: #2563eb;
      font-size: 0.85rem;
      width: 18px;
    }

    .image-col .label .tag {
      margin-left: auto;
      background: #eef2f6;
      color: #4a5568;
      font-size: 0.5rem;
      font-weight: 600;
      padding: 2px 10px;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input-row .btn-upload {
      background: #ffffff;
      border: 1px solid #d1d9e6;
      padding: 5px 14px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #1a1f2e;
      cursor: pointer;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .input-row .btn-upload:hover {
      background: #f0f4ff;
      border-color: #2563eb;
    }

    .input-row .btn-upload i {
      color: #2563eb;
      font-size: 0.65rem;
    }

    .input-row input[type="file"] {
      display: none;
    }

    .input-row .filename {
      font-size: 0.65rem;
      color: #4a5a74;
      background: #eef2f8;
      padding: 3px 12px;
      white-space: nowrap;
      overflow: hidden;
      max-width: 100px;
      text-overflow: ellipsis;
    }

    .paste-area {
      margin-top: 8px;
      background: #ffffff;
      border: 1px dashed #d1d9e6;
      padding: 3px 14px 3px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .paste-area i {
      color: #6a7f9e;
      font-size: 0.7rem;
    }

    .paste-area .hint {
      background: #eef2f8;
      padding: 1px 10px;
      font-size: 0.55rem;
      font-weight: 600;
      color: #2d3f5a;
      letter-spacing: 0.2px;
    }

    .paste-area .label {
      font-size: 0.6rem;
      color: #5a6f8a;
    }

    .paste-status {
      margin-left: auto;
      font-size: 0.55rem;
      color: #2563eb;
      background: #eff6ff;
      padding: 2px 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .paste-status.done {
      color: #059669;
      background: #ecfdf5;
    }

    /* ACTION ROW */
    .action-row {
      display: flex;
      gap: 14px;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #d1d9e6;
      padding: 11px 20px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1a1f2e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.1s;
      flex: 1;
    }

    .btn-primary {
      background: #0a0a0f;
      border: 1px solid #0a0a0f;
      color: #ffffff;
      flex: 1.5;
      box-shadow: 0 2px 12px rgba(10, 10, 15, 0.08);
    }

    .btn-primary i {
      color: #9aa8c4;
    }

    .btn-primary:hover {
      background: #1a1f2e;
      border-color: #1a1f2e;
    }

    .btn-outline:hover {
      background: #f3f6fa;
      border-color: #b0bccd;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .app { padding: 12px 12px 16px; }

      .preview-section {
        max-width: 320px;
        padding: 4px;
        margin-bottom: 12px;
      }

      .image-row {
        gap: 12px;
      }

      .image-col {
        padding: 10px 10px 12px;
      }

      .image-col .label {
        font-size: 0.7rem;
      }

      .input-row .btn-upload {
        font-size: 0.6rem;
        padding: 4px 10px;
      }

      .input-row .filename {
        max-width: 70px;
        font-size: 0.6rem;
        padding: 2px 10px;
      }

      .paste-area {
        padding: 3px 10px 3px 12px;
        gap: 4px;
      }
      .paste-area .hint { font-size: 0.5rem; padding: 1px 8px; }
      .paste-area .label { font-size: 0.55rem; }
      .paste-status { font-size: 0.5rem; padding: 2px 10px; }

      .action-row {
        gap: 10px;
      }
      .btn {
        font-size: 0.7rem;
        padding: 9px 12px;
        gap: 6px;
      }
    }

    @media (max-width: 480px) {
      body { padding: 6px; }
      .app { padding: 8px 6px 12px; }

      .preview-section {
        max-width: 240px;
        padding: 3px;
        margin-bottom: 10px;
      }

      .placeholder {
        font-size: 0.55rem;
        padding: 8px;
      }
      .placeholder i {
        font-size: 1.4rem;
        margin-bottom: 4px;
      }
      .placeholder small {
        font-size: 0.45rem;
      }

      .image-row {
        gap: 6px;
        flex-direction: row;
      }

      .image-col {
        padding: 6px 6px 8px;
        min-width: 0;
      }

      .image-col .label {
        font-size: 0.55rem;
        margin-bottom: 4px;
        gap: 4px;
      }

      .image-col .label i {
        font-size: 0.6rem;
        width: 12px;
      }

      .image-col .label .tag {
        font-size: 0.4rem;
        padding: 1px 6px;
      }

      .input-row {
        gap: 4px;
      }

      .input-row .btn-upload {
        font-size: 0.5rem;
        padding: 3px 6px;
        gap: 3px;
      }

      .input-row .btn-upload i {
        font-size: 0.45rem;
      }

      .input-row .filename {
        max-width: 40px;
        font-size: 0.45rem;
        padding: 2px 6px;
      }

      .paste-area {
        padding: 2px 6px 2px 8px;
        gap: 3px;
        margin-top: 4px;
      }

      .paste-area i {
        font-size: 0.5rem;
      }

      .paste-area .hint {
        font-size: 0.4rem;
        padding: 1px 6px;
      }

      .paste-area .label {
        font-size: 0.4rem;
      }

      .paste-status {
        font-size: 0.4rem;
        padding: 1px 6px;
      }

      .action-row {
        gap: 6px;
      }

      .btn {
        font-size: 0.55rem;
        padding: 7px 6px;
        gap: 4px;
        flex: 1 1 auto;
        min-width: 50px;
      }

      .btn-primary {
        flex: 1.2;
      }
    }

    @media (max-width: 360px) {
      .app { padding: 4px 4px 8px; }

      .preview-section {
        max-width: 180px;
        padding: 2px;
        margin-bottom: 8px;
      }

      .image-row {
        gap: 4px;
      }

      .image-col {
        padding: 4px 4px 6px;
      }

      .image-col .label {
        font-size: 0.45rem;
      }

      .input-row .btn-upload {
        font-size: 0.4rem;
        padding: 2px 4px;
      }

      .input-row .filename {
        max-width: 30px;
        font-size: 0.35rem;
        padding: 1px 4px;
      }

      .paste-area {
        padding: 1px 4px 1px 6px;
      }
      .paste-area .hint { font-size: 0.35rem; padding: 1px 4px; }
      .paste-area .label { font-size: 0.35rem; }
      .paste-status { font-size: 0.35rem; padding: 1px 4px; }

      .btn {
        font-size: 0.45rem;
        padding: 5px 4px;
        min-width: 35px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- PREVIEW — rasio otomatis -->
  <div class="preview-section">
    <div class="story-frame" id="storyPreview">
      <img id="primaryImg" src="" alt="primary">
      <img id="secondaryImg" src="" alt="secondary">
      <div id="placeholderText" class="placeholder">
        <i class="fas fa-image"></i>
        Upload 2 gambar
        <small>Rasio otomatis mengikuti gambar utama</small>
      </div>
    </div>
    <div style="text-align:center; margin-top:4px; font-size:0.6rem; color:#6b7f96;">
      <span id="ratioDisplay">Rasio: 9:16</span>
    </div>
  </div>

  <!-- IMAGE ROW: Primary | Secondary — tetap 2 kolom -->
  <div class="image-row">
    <!-- Primary -->
    <div class="image-col" id="primaryItem">
      <div class="label">
        <i class="fas fa-camera"></i> Utama
        <span class="tag" id="primaryRatioTag">9:16</span>
      </div>
      <div class="input-row">
        <label class="btn-upload" for="primaryInput"><i class="fas fa-upload"></i> Pilih</label>
        <input type="file" id="primaryInput" accept="image/*">
        <span class="filename" id="primaryFileName">kosong</span>
      </div>
      <div class="paste-area" id="pasteZonePrimary">
        <i class="fas fa-paste"></i>
        <span class="hint">Paste</span>
        <span class="label">Ctrl+V</span>
        <span class="paste-status" id="pasteStatusPrimary">siap</span>
      </div>
    </div>

    <!-- Secondary -->
    <div class="image-col" id="secondaryItem">
      <div class="label">
        <i class="fas fa-sticky-note"></i> Sekunder
        <span class="tag">overlay</span>
      </div>
      <div class="input-row">
        <label class="btn-upload" for="secondaryInput"><i class="fas fa-upload"></i> Pilih</label>
        <input type="file" id="secondaryInput" accept="image/*">
        <span class="filename" id="secondaryFileName">kosong</span>
      </div>
      <div class="paste-area" id="pasteZoneSecondary">
        <i class="fas fa-paste"></i>
        <span class="hint">Paste</span>
        <span class="label">Ctrl+V</span>
        <span class="paste-status" id="pasteStatusSecondary">siap</span>
      </div>
    </div>
  </div>

  <!-- ACTION ROW: Reset | Download -->
  <div class="action-row">
    <button class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
    <button class="btn btn-primary" id="downloadBtn"><i class="fas fa-download"></i> Download</button>
  </div>
</div>

<script>
  (function() {
    const primaryInput = document.getElementById('primaryInput');
    const secondaryInput = document.getElementById('secondaryInput');
    const primaryImg = document.getElementById('primaryImg');
    const secondaryImg = document.getElementById('secondaryImg');
    const placeholderText = document.getElementById('placeholderText');
    const primaryFileName = document.getElementById('primaryFileName');
    const secondaryFileName = document.getElementById('secondaryFileName');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const pasteStatusPrimary = document.getElementById('pasteStatusPrimary');
    const pasteStatusSecondary = document.getElementById('pasteStatusSecondary');
    const storyFrame = document.getElementById('storyPreview');
    const ratioDisplay = document.getElementById('ratioDisplay');
    const primaryRatioTag = document.getElementById('primaryRatioTag');

    let primaryDataURL = null;
    let secondaryDataURL = null;
    let currentRatio = '9/16'; // default

    // ========== FUNGSI UPDATE RATIO ==========
    function updateAspectRatio(imgWidth, imgHeight) {
      if (!imgWidth || !imgHeight) return;
      
      // Hitung rasio
      const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
      const divisor = gcd(imgWidth, imgHeight);
      const ratioW = imgWidth / divisor;
      const ratioH = imgHeight / divisor;
      
      // Simpan rasio untuk download
      currentRatio = `${ratioW}/${ratioH}`;
      
      // Update CSS aspect-ratio
      storyFrame.style.aspectRatio = currentRatio;
      
      // Update display
      ratioDisplay.textContent = `Rasio: ${ratioW}:${ratioH}`;
      primaryRatioTag.textContent = `${ratioW}:${ratioH}`;
      
      console.log(`📐 Rasio diupdate: ${ratioW}:${ratioH}`);
    }

    // ========== FUNGSI UPDATE PREVIEW ==========
    function updatePreview() {
      if (primaryDataURL) {
        primaryImg.src = primaryDataURL;
        primaryImg.style.display = 'block';
        
        // Update rasio berdasarkan gambar utama
        const img = new Image();
        img.onload = function() {
          updateAspectRatio(this.width, this.height);
        };
        img.src = primaryDataURL;
        // Jika gambar sudah loaded
        if (img.complete && img.naturalWidth) {
          updateAspectRatio(img.naturalWidth, img.naturalHeight);
        }
      } else {
        primaryImg.style.display = 'none';
        primaryImg.src = '';
        // Reset ke default 9:16
        storyFrame.style.aspectRatio = '9/16';
        ratioDisplay.textContent = 'Rasio: 9:16 (default)';
        primaryRatioTag.textContent = '9:16';
        currentRatio = '9/16';
      }
      
      if (secondaryDataURL) {
        secondaryImg.src = secondaryDataURL;
        secondaryImg.style.display = 'block';
      } else {
        secondaryImg.style.display = 'none';
        secondaryImg.src = '';
      }
      
      placeholderText.style.display = (!primaryDataURL && !secondaryDataURL) ? 'block' : 'none';
    }

    // ========== SET GAMBAR ==========
    function setPrimaryImage(dataURL, fileName = '') {
      primaryDataURL = dataURL;
      primaryFileName.textContent = fileName ? (fileName.length > 12 ? fileName.slice(0, 10) + '…' : fileName) : '📋 paste';
      pasteStatusPrimary.textContent = '✓';
      pasteStatusPrimary.className = 'paste-status done';
      
      // Update rasio dari gambar
      const img = new Image();
      img.onload = function() {
        updateAspectRatio(this.width, this.height);
        updatePreview();
      };
      img.onerror = function() {
        updatePreview();
      };
      img.src = dataURL;
      
      // Jika gambar sudah cached
      if (img.complete && img.naturalWidth) {
        updateAspectRatio(img.naturalWidth, img.naturalHeight);
      }
      
      updatePreview();
    }

    function setSecondaryImage(dataURL, fileName = '') {
      secondaryDataURL = dataURL;
      secondaryFileName.textContent = fileName ? (fileName.length > 12 ? fileName.slice(0, 10) + '…' : fileName) : '📋 paste';
      pasteStatusSecondary.textContent = '✓';
      pasteStatusSecondary.className = 'paste-status done';
      updatePreview();
    }

    // ========== HANDLE FILE ==========
    function handleFile(file, isPrimary) {
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Pilih file gambar.'); return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataURL = e.target.result;
        if (isPrimary) {
          setPrimaryImage(dataURL, file.name);
        } else {
          setSecondaryImage(dataURL, file.name);
        }
      };
      reader.onerror = function() { alert('Gagal baca file.'); };
      reader.readAsDataURL(file);
    }

    // ========== EVENT LISTENERS ==========
    primaryInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) {
        handleFile(this.files[0], true);
      } else if (!primaryDataURL) {
        primaryFileName.textContent = 'kosong';
        pasteStatusPrimary.textContent = 'siap';
        pasteStatusPrimary.className = 'paste-status';
        storyFrame.style.aspectRatio = '9/16';
        ratioDisplay.textContent = 'Rasio: 9:16 (default)';
        primaryRatioTag.textContent = '9:16';
        currentRatio = '9/16';
        updatePreview();
      }
      this.value = '';
    });

    secondaryInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) {
        handleFile(this.files[0], false);
      } else if (!secondaryDataURL) {
        secondaryFileName.textContent = 'kosong';
        pasteStatusSecondary.textContent = 'siap';
        pasteStatusSecondary.className = 'paste-status';
        updatePreview();
      }
      this.value = '';
    });

    // ========== PASTE ==========
    function setupPaste(itemElement, isPrimary) {
      itemElement.addEventListener('paste', function(e) {
        const items = (e.clipboardData || e.originalEvent?.clipboardData || window.clipboardData)?.items;
        if (!items) return;
        let imageItem = null;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.startsWith('image/')) { imageItem = items[i]; break; }
        }
        if (!imageItem) {
          for (let i = 0; i < items.length; i++) {
            if (items[i].kind === 'file' && items[i].type.startsWith('image/')) { imageItem = items[i]; break; }
          }
        }
        if (!imageItem) { alert('Tidak ada gambar di clipboard.'); return; }
        const file = imageItem.getAsFile ? imageItem.getAsFile() : null;
        if (!file) { alert('Gagal ambil gambar.'); return; }
        const reader = new FileReader();
        reader.onload = function(ev) {
          const dataURL = ev.target.result;
          if (isPrimary) {
            setPrimaryImage(dataURL, '📋 paste');
          } else {
            setSecondaryImage(dataURL, '📋 paste');
          }
        };
        reader.onerror = function() { alert('Gagal proses paste.'); };
        reader.readAsDataURL(file);
        e.preventDefault();
        return false;
      });
    }

    setupPaste(document.getElementById('primaryItem'), true);
    setupPaste(document.getElementById('secondaryItem'), false);

    // ========== RESET ==========
    resetBtn.addEventListener('click', function() {
      primaryDataURL = null;
      secondaryDataURL = null;
      primaryImg.style.display = 'none';
      secondaryImg.style.display = 'none';
      primaryImg.src = '';
      secondaryImg.src = '';
      primaryFileName.textContent = 'kosong';
      secondaryFileName.textContent = 'kosong';
      placeholderText.style.display = 'block';
      primaryInput.value = '';
      secondaryInput.value = '';
      pasteStatusPrimary.textContent = 'siap';
      pasteStatusPrimary.className = 'paste-status';
      pasteStatusSecondary.textContent = 'siap';
      pasteStatusSecondary.className = 'paste-status';
      
      // Reset rasio ke default
      storyFrame.style.aspectRatio = '9/16';
      ratioDisplay.textContent = 'Rasio: 9:16 (default)';
      primaryRatioTag.textContent = '9:16';
      currentRatio = '9/16';
    });

    // ========== DOWNLOAD ==========
    function downloadStory() {
      if (!primaryDataURL) { alert('Upload atau paste gambar utama dulu!'); return; }
      
      // Parse rasio
      const [ratioW, ratioH] = currentRatio.split('/').map(Number);
      const canvasWidth = 800;
      const canvasHeight = Math.round(canvasWidth * (ratioH / ratioW));
      
      const canvas = document.createElement('canvas');
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const ctx = canvas.getContext('2d');

      const primary = new Image();
      primary.crossOrigin = 'anonymous';
      primary.src = primaryDataURL;

      const secondary = new Image();
      secondary.crossOrigin = 'anonymous';
      if (secondaryDataURL) secondary.src = secondaryDataURL;

      let primaryLoaded = false;
      let secondaryLoaded = !secondaryDataURL;

      function checkAndDraw() {
        if (!primaryLoaded) return;
        if (secondaryDataURL && !secondaryLoaded) return;
        
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // Gambar primary — full cover
        const pAspect = primary.width / primary.height;
        const canvasAspect = canvasWidth / canvasHeight;
        let sx = 0, sy = 0, sw = primary.width, sh = primary.height;
        if (pAspect > canvasAspect) {
          const scale = canvasHeight / primary.height;
          const cropWidth = canvasWidth / scale;
          sx = (primary.width - cropWidth) / 2;
          sw = cropWidth;
        } else {
          const scale = canvasWidth / primary.width;
          const cropHeight = canvasHeight / scale;
          sy = (primary.height - cropHeight) / 2;
          sh = cropHeight;
        }
        ctx.drawImage(primary, sx, sy, sw, sh, 0, 0, canvasWidth, canvasHeight);

        // Gambar secondary — overlay di tengah atas
        if (secondaryDataURL && secondaryLoaded) {
          const maxWidth = canvasWidth * 0.66;
          const maxHeight = canvasHeight * 0.42;
          let sWidth = secondary.width, sHeight = secondary.height;
          let scale = 1;
          if (sWidth > maxWidth) scale = maxWidth / sWidth;
          if (sHeight * scale > maxHeight) scale = Math.min(scale, maxHeight / sHeight);
          const finalWidth = sWidth * scale;
          const finalHeight = sHeight * scale;
          const x = (canvasWidth - finalWidth) / 2;
          const y = canvasHeight * 0.14;
          
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 24;
          ctx.shadowOffsetY = 8;
          ctx.drawImage(secondary, x, y, finalWidth, finalHeight);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.04)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x, y, finalWidth, finalHeight);
        }

        const link = document.createElement('a');
        link.download = `story-${ratioW}x${ratioH}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      primary.onload = function() { primaryLoaded = true; checkAndDraw(); };
      primary.onerror = function() { alert('Gagal memuat gambar utama.'); };
      
      if (secondaryDataURL) {
        secondary.onload = function() { secondaryLoaded = true; checkAndDraw(); };
        secondary.onerror = function() { secondaryLoaded = true; checkAndDraw(); };
      } else {
        secondaryLoaded = true;
      }

      if (primary.complete && primary.naturalWidth !== 0) {
        primaryLoaded = true;
        checkAndDraw();
      }
      if (secondaryDataURL && secondary.complete && secondary.naturalWidth !== 0) {
        secondaryLoaded = true;
        checkAndDraw();
      }
    }

    downloadBtn.addEventListener('click', downloadStory);
    updatePreview();
  })();
</script>
</body>
</html>
