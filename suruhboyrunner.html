<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SuruhBoy Runner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
background:#6ec6ff;
}

canvas{
display:block;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
font-weight:bold;
}

#distance{
position:absolute;
top:10px;
right:20px;
color:white;
}

#score{
position:absolute;
bottom:20px;
left:20px;
color:white;
font-size:22px;
}

#combo{
position:absolute;
bottom:50px;
left:20px;
color:yellow;
font-size:18px;
}

#boost{
position:absolute;
bottom:20px;
right:20px;
background:rgba(0,0,0,0.4);
padding:8px;
border-radius:8px;
color:white;
}

.controls{
position:absolute;
bottom:80px;
width:100%;
display:flex;
justify-content:center;
gap:20px;
}

.btn{
width:70px;
height:70px;
background:#FFD21F;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

#gameover{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
border-radius:10px;
display:none;
text-align:center;
}

</style>
</head>

<body>

<div id="ui">💰 <span id="coins">0</span></div>
<div id="distance">📍 <span id="meter">0</span> m</div>
<div id="score">Score: <span id="sc">0</span></div>
<div id="combo">Combo x<span id="cmb">1</span></div>
<div id="boost">⚡ Boost</div>

<div id="gameover">
<h2>ORDER FAILED</h2>
<button onclick="location.reload()">Restart</button>
</div>

<canvas id="game"></canvas>

<div class="controls">
<div class="btn" id="left">⬅</div>
<div class="btn" id="jump">⬆</div>
<div class="btn" id="slide">⬇</div>
<div class="btn" id="right">➡</div>
</div>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=innerWidth
canvas.height=innerHeight

let lane=1
let targetLane=1

let playerY=0
let velY=0
let gravity=0.8

let jumping=false
let sliding=false

let speed=6
let boost=0

let score=0
let coins=0
let distance=0
let combo=1

const lanes=[
canvas.width/2-160,
canvas.width/2,
canvas.width/2+160
]

let obstacles=[]
let items=[]
let particles=[]

function spawnObstacle(){

let types=["motor","cart","hole","cone","box","chicken"]

obstacles.push({
lane:Math.floor(Math.random()*3),
y:-80,
type:types[Math.floor(Math.random()types.length)]
})

}

function spawnItem(){

let types=["coin","coin","coin","boost","slow","package"]

items.push({
lane:Math.floor(Math.random()3),
y:-50,
type:types[Math.floor(Math.random()types.length)],
angle:0
})

}

setInterval(spawnObstacle,1400)
setInterval(spawnItem,900)

function moveLeft(){
if(targetLane>0)targetLane--
}

function moveRight(){
if(targetLane<2)targetLane++
}

function jump(){

if(!jumping){
velY=-16
jumping=true
}

}

function slide(){

sliding=true

setTimeout(()=>{

sliding=false

},500)

}

document.getElementById("left").onclick=moveLeft
document.getElementById("right").onclick=moveRight
document.getElementById("jump").onclick=jump
document.getElementById("slide").onclick=slide

document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft")moveLeft()
if(e.key==="ArrowRight")moveRight()
if(e.key==="ArrowUp")jump()
if(e.key==="ArrowDown")slide()

})

let startX=0
let startY=0

document.addEventListener("touchstart",e=>{
startX=e.touches[0].screenX
startY=e.touches[0].screenY
})

document.addEventListener("touchend",e=>{

let dx=e.changedTouches[0].screenX-startX
let dy=e.changedTouches[0].screenY-startY

if(Math.abs(dx)>Math.abs(dy)){

if(dx>50)moveRight()
if(dx<-50)moveLeft()

}else{

if(dy<-50)jump()
if(dy>50)slide()

}

})

function drawPlayer(){

lane+=(targetLane-lane)0.2

let x=lanes[Math.round(lane)]

ctx.fillStyle="yellow"

let h=sliding?40:80

ctx.fillRect(x-20,canvas.height-120+playerY,40,h)

ctx.fillStyle="black"
ctx.fillText("SB",x-12,canvas.height-130+playerY)

}

function drawObstacle(o){

let x=lanes[o.lane]

ctx.save()

ctx.translate(x,o.y)

if(o.type==="motor"){

ctx.fillStyle="red"
ctx.fillRect(-25,0,50,30)

}

if(o.type==="cart"){

ctx.fillStyle="#8B4513"
ctx.fillRect(-30,0,60,40)

}

if(o.type==="hole"){

ctx.fillStyle="black"
ctx.beginPath()
ctx.arc(0,0,25,0,Math.PI2)
ctx.fill()

}

if(o.type==="cone"){

ctx.fillStyle="orange"
ctx.fillRect(-10,0,20,40)

}

if(o.type==="box"){

ctx.fillStyle="#b5651d"
ctx.fillRect(-20,0,40,40)

}

if(o.type==="chicken"){

ctx.fillStyle="white"
ctx.beginPath()
ctx.arc(0,0,15,0,Math.PI2)
ctx.fill()

o.lane+=Math.sin(o.y0.05)0.01

}

ctx.restore()

}

function drawItem(i){

let x=lanes[i.lane]

i.angle+=0.1

ctx.save()

ctx.translate(x,i.y)

ctx.rotate(i.angle)

if(i.type==="coin"){

ctx.fillStyle="gold"
ctx.beginPath()
ctx.arc(0,0,14,0,Math.PI2)
ctx.fill()

}

if(i.type==="boost"){

ctx.fillStyle="lime"
ctx.fillRect(-12,-15,24,30)

}

if(i.type==="slow"){

ctx.fillStyle="purple"
ctx.beginPath()
ctx.arc(0,0,15,0,Math.PI2)
ctx.fill()

}

if(i.type==="package"){

ctx.fillStyle="#b5651d"
ctx.fillRect(-15,-15,30,30)

}

ctx.restore()

}

function spawnParticles(x,y){

for(let i=0;i<6;i++){

particles.push({

x:x,
y:y,
vx:(Math.random()-0.5)4,
vy:(Math.random()-0.5)4,
life:30

})

}

}

function updateParticles(){

particles.forEach(p=>{

p.x+=p.vx
p.y+=p.vy
p.life--

ctx.fillStyle="yellow"
ctx.fillRect(p.x,p.y,4,4)

})

particles=particles.filter(p=>p.life>0)

}

function gameOver(){

document.getElementById("gameover").style.display="block"

}

function update(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="#555"
ctx.fillRect(canvas.width/2-220,0,440,canvas.height)

velY+=gravity
playerY+=velY

if(playerY>0){

playerY=0
velY=0
jumping=false

}

drawPlayer()

obstacles.forEach(o=>{

o.y+=speed

drawObstacle(o)

if(

Math.abs(o.lane-targetLane)<0.2 &&

o.y>canvas.height-140 &&

o.y<canvas.height-60 &&

!jumping

){

gameOver()

}

})

items.forEach(i=>{

i.y+=speed

drawItem(i)

if(

i.lane===targetLane &&

i.y>canvas.height-140 &&

i.y<canvas.height-60

){

spawnParticles(lanes[i.lane],i.y)

if(i.type==="coin"){

coins++
score+=10combo
combo++

}

if(i.type==="boost"){

boost=200

}

if(i.type==="slow"){

speed=Math.max(3,speed-2)
combo=1

}

if(i.type==="package"){

score+=50

}

i.y=canvas.height+200

}

})

updateParticles()

if(boost>0){

boost--
speed=10

}else{

speed=6+distance0.002

}

score++
distance++

document.getElementById("coins").innerText=coins
document.getElementById("sc").innerText=score
document.getElementById("meter").innerText=distance
document.getElementById("cmb").innerText=combo

requestAnimationFrame(update)

}

update()

</script>

</body>
</html>
