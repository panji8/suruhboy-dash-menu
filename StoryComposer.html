<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Composer · Flat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background: #eef1f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      padding: 32px 40px 36px;
      border: 1px solid #e2e6ec;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e8ecf2;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0a0a0f;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 i {
      color: #2563eb;
      font-size: 1.4rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header .badge {
      background: #eef2f6;
      color: #4a5568;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 16px;
      letter-spacing: 0.3px;
    }

    .header .hint {
      color: #6b7f96;
      font-size: 0.8rem;
    }

    /* MAIN LAYOUT */
    .main-layout {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    /* LEFT — Preview */
    .preview-section {
      flex: 0 0 340px;
      background: #f6f8fa;
      padding: 8px;
      border: 1px solid #e2e6ec;
    }

    .story-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #0e121c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #primaryImg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #secondaryImg {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      max-width: 66%;
      max-height: 42%;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      background: #0b111e;
      display: none;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
      text-align: center;
      padding: 20px;
      z-index: 2;
      pointer-events: none;
      line-height: 1.7;
    }

    .placeholder i {
      display: block;
      font-size: 2.6rem;
      margin-bottom: 10px;
      opacity: 0.35;
      color: #7a8aa3;
    }

    .placeholder small {
      font-size: 0.7rem;
      opacity: 0.5;
      display: block;
    }

    /* RIGHT — Controls */
    .controls {
      flex: 1;
      min-width: 0;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .upload-card {
      background: #f7f9fb;
      padding: 18px 20px 20px;
      border: 1px solid #e2e6ec;
      transition: 0.15s;
    }

    .upload-card:focus-within {
      border-color: #2563eb;
      background: #fafcff;
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-head i {
      font-size: 1rem;
      width: 24px;
      color: #2563eb;
    }

    .card-head .title {
      font-weight: 600;
      color: #0a0a0f;
      font-size: 0.95rem;
    }

    .card-head .tag {
      margin-left: auto;
      background: #eef2f6;
      color: #4a5568;
      font-size: 0.55rem;
      font-weight: 600;
      padding: 3px 14px;
      letter-spacing: 0.2px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-row .btn-upload {
      background: #ffffff;
      border: 1px solid #d1d9e6;
      padding: 7px 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1a1f2e;
      cursor: pointer;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .input-row .btn-upload:hover {
      background: #f0f4ff;
      border-color: #2563eb;
    }

    .input-row .btn-upload i {
      color: #2563eb;
      font-size: 0.7rem;
    }

    .input-row input[type="file"] {
      display: none;
    }

    .input-row .filename {
      font-size: 0.75rem;
      color: #4a5a74;
      background: #eef2f8;
      padding: 4px 18px;
      white-space: nowrap;
      overflow: hidden;
      max-width: 160px;
      text-overflow: ellipsis;
    }

    .paste-area {
      margin-top: 10px;
      background: #ffffff;
      border: 1px dashed #d1d9e6;
      padding: 5px 20px 5px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .paste-area i {
      color: #6a7f9e;
      font-size: 0.8rem;
    }

    .paste-area .hint {
      background: #eef2f8;
      padding: 2px 14px;
      font-size: 0.65rem;
      font-weight: 600;
      color: #2d3f5a;
      letter-spacing: 0.2px;
    }

    .paste-area .label {
      font-size: 0.7rem;
      color: #5a6f8a;
    }

    .paste-status {
      margin-left: auto;
      font-size: 0.65rem;
      color: #2563eb;
      background: #eff6ff;
      padding: 2px 16px;
      font-weight: 500;
    }

    .paste-status.done {
      color: #059669;
      background: #ecfdf5;
    }

    /* ACTIONS — 3 tombol */
    .actions {
      display: flex;
      gap: 14px;
      padding: 4px 0;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #d1d9e6;
      padding: 14px 20px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1a1f2e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.1s;
      flex: 1;
    }

    .btn-primary {
      background: #0a0a0f;
      border: 1px solid #0a0a0f;
      color: #ffffff;
      flex: 1.2;
      box-shadow: 0 2px 12px rgba(10, 10, 15, 0.08);
    }

    .btn-primary i {
      color: #9aa8c4;
    }

    .btn-primary:hover {
      background: #1a1f2e;
      border-color: #1a1f2e;
    }

    .btn-wa {
      background: #25d366;
      border: 1px solid #25d366;
      color: #ffffff;
      flex: 1.2;
      box-shadow: 0 2px 12px rgba(37, 211, 102, 0.15);
    }

    .btn-wa i {
      color: #ffffff;
    }

    .btn-wa:hover {
      background: #1da851;
      border-color: #1da851;
    }

    .btn-outline:hover {
      background: #f3f6fa;
      border-color: #b0bccd;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      color: #9aa8b8;
      font-size: 0.7rem;
      padding-top: 18px;
      border-top: 2px solid #e8ecf2;
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .footer i {
      color: #6b7f96;
      margin-right: 4px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .app {
        padding: 24px 28px 28px;
      }
      .main-layout {
        flex-direction: column;
        align-items: stretch;
        gap: 24px;
      }
      .preview-section {
        flex: none;
        max-width: 340px;
        margin: 0 auto;
        width: 100%;
      }
      .header h1 { font-size: 1.4rem; }
      .header .hint { display: none; }
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .app {
        padding: 16px 14px 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
        border: 1px solid #e2e6ec;
      }
      .header {
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
        padding-bottom: 12px;
      }
      .header h1 {
        font-size: 1.2rem;
        gap: 8px;
      }
      .header h1 i { font-size: 1.1rem; }
      .header .badge { font-size: 0.6rem; padding: 3px 12px; }
      .header-right { width: 100%; justify-content: flex-start; }
      .header .hint { display: none; }

      .preview-section {
        max-width: 100%;
        padding: 6px;
      }

      .upload-card {
        padding: 14px 14px 16px;
      }
      .card-head .title { font-size: 0.85rem; }
      .input-row .btn-upload { font-size: 0.7rem; padding: 6px 16px; }
      .input-row .filename { max-width: 80px; font-size: 0.65rem; padding: 3px 12px; }
      .paste-area { padding: 4px 14px 4px 16px; gap: 6px; }
      .paste-area .hint { font-size: 0.55rem; padding: 2px 10px; }
      .paste-area .label { font-size: 0.6rem; }
      .paste-status { font-size: 0.55rem; padding: 2px 12px; }

      .actions {
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        font-size: 0.7rem;
        padding: 11px 10px;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 80px;
      }
      .btn-primary { flex: 1.2; }
      .btn-wa { flex: 1.2; }

      .footer {
        font-size: 0.55rem;
        gap: 12px;
        padding-top: 14px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 380px) {
      .app { padding: 12px 10px 16px; }
      .upload-card { padding: 10px 10px 14px; }
      .input-row { gap: 6px; }
      .input-row .filename { max-width: 60px; }
      .btn { font-size: 0.6rem; padding: 9px 6px; min-width: 60px; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <h1><i class="fas fa-cubes"></i> Story Composer</h1>
    <div class="header-right">
      <span class="badge">v2.0</span>
      <span class="hint"><i class="fas fa-arrow-right" style="color: #2563eb;"></i> Upload atau Paste</span>
    </div>
  </div>

  <!-- Main -->
  <div class="main-layout">
    <!-- Preview -->
    <div class="preview-section">
      <div class="story-frame" id="storyPreview">
        <img id="primaryImg" src="" alt="primary">
        <img id="secondaryImg" src="" alt="secondary">
        <div id="placeholderText" class="placeholder">
          <i class="fas fa-image"></i>
          Upload atau paste 2 gambar
          <small>Utama 9:16 · Sekunder overlay</small>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="upload-group">
        <!-- Primary -->
        <div class="upload-card" id="primaryItem">
          <div class="card-head">
            <i class="fas fa-camera"></i>
            <span class="title">Gambar Utama</span>
            <span class="tag">9:16</span>
          </div>
          <div class="input-row">
            <label class="btn-upload" for="primaryInput"><i class="fas fa-upload"></i> Pilih</label>
            <input type="file" id="primaryInput" accept="image/*">
            <span class="filename" id="primaryFileName">kosong</span>
          </div>
          <div class="paste-area" id="pasteZonePrimary">
            <i class="fas fa-paste"></i>
            <span class="hint">Paste</span>
            <span class="label">Ctrl+V</span>
            <span class="paste-status" id="pasteStatusPrimary">siap</span>
          </div>
        </div>

        <!-- Secondary -->
        <div class="upload-card" id="secondaryItem">
          <div class="card-head">
            <i class="fas fa-sticky-note"></i>
            <span class="title">Gambar Sekunder</span>
            <span class="tag">overlay</span>
          </div>
          <div class="input-row">
            <label class="btn-upload" for="secondaryInput"><i class="fas fa-upload"></i> Pilih</label>
            <input type="file" id="secondaryInput" accept="image/*">
            <span class="filename" id="secondaryFileName">kosong</span>
          </div>
          <div class="paste-area" id="pasteZoneSecondary">
            <i class="fas fa-paste"></i>
            <span class="hint">Paste</span>
            <span class="label">Ctrl+V</span>
            <span class="paste-status" id="pasteStatusSecondary">siap</span>
          </div>
        </div>
      </div>

      <!-- Actions — 3 tombol: Reset, Download, Share WA -->
      <div class="actions">
        <button class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
        <button class="btn btn-primary" id="downloadBtn"><i class="fas fa-download"></i> Download</button>
        <button class="btn btn-wa" id="shareWaBtn"><i class="fab fa-whatsapp"></i> Share WA</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span><i class="fas fa-arrows-alt"></i> Sekunder di tengah atas</span>
    <span><i class="fas fa-mobile-alt"></i> 9:16</span>
    <span><i class="fas fa-image"></i> PNG 540×960</span>
  </div>
</div>

<script>
  (function() {
    const primaryInput = document.getElementById('primaryInput');
    const secondaryInput = document.getElementById('secondaryInput');
    const primaryImg = document.getElementById('primaryImg');
    const secondaryImg = document.getElementById('secondaryImg');
    const placeholderText = document.getElementById('placeholderText');
    const primaryFileName = document.getElementById('primaryFileName');
    const secondaryFileName = document.getElementById('secondaryFileName');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareWaBtn = document.getElementById('shareWaBtn');
    const pasteStatusPrimary = document.getElementById('pasteStatusPrimary');
    const pasteStatusSecondary = document.getElementById('pasteStatusSecondary');

    const WA_NUMBER = '62882007670299';

    let primaryDataURL = null;
    let secondaryDataURL = null;

    function updatePreview() {
      if (primaryDataURL) {
        primaryImg.src = primaryDataURL;
        primaryImg.style.display = 'block';
      } else {
        primaryImg.style.display = 'none';
        primaryImg.src = '';
      }
      if (secondaryDataURL) {
        secondaryImg.src = secondaryDataURL;
        secondaryImg.style.display = 'block';
      } else {
        secondaryImg.style.display = 'none';
        secondaryImg.src = '';
      }
      placeholderText.style.display = (!primaryDataURL && !secondaryDataURL) ? 'block' : 'none';
    }

    function setPrimaryImage(dataURL, fileName = '') {
      primaryDataURL = dataURL;
      primaryFileName.textContent = fileName ? (fileName.length > 16 ? fileName.slice(0, 14) + '…' : fileName) : '📋 paste';
      pasteStatusPrimary.textContent = '✓';
      pasteStatusPrimary.className = 'paste-status done';
      updatePreview();
    }

    function setSecondaryImage(dataURL, fileName = '') {
      secondaryDataURL = dataURL;
      secondaryFileName.textContent = fileName ? (fileName.length > 16 ? fileName.slice(0, 14) + '…' : fileName) : '📋 paste';
      pasteStatusSecondary.textContent = '✓';
      pasteStatusSecondary.className = 'paste-status done';
      updatePreview();
    }

    function handleFile(file, isPrimary) {
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Pilih file gambar.'); return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataURL = e.target.result;
        if (isPrimary) setPrimaryImage(dataURL, file.name);
        else setSecondaryImage(dataURL, file.name);
      };
      reader.onerror = function() { alert('Gagal baca file.'); };
      reader.readAsDataURL(file);
    }

    primaryInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) handleFile(this.files[0], true);
      else if (!primaryDataURL) { primaryFileName.textContent = 'kosong'; pasteStatusPrimary.textContent = 'siap'; pasteStatusPrimary.className = 'paste-status'; }
      this.value = '';
    });

    secondaryInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) handleFile(this.files[0], false);
      else if (!secondaryDataURL) { secondaryFileName.textContent = 'kosong'; pasteStatusSecondary.textContent = 'siap'; pasteStatusSecondary.className = 'paste-status'; }
      this.value = '';
    });

    function setupPaste(itemElement, isPrimary) {
      itemElement.addEventListener('paste', function(e) {
        const items = (e.clipboardData || e.originalEvent?.clipboardData || window.clipboardData)?.items;
        if (!items) return;
        let imageItem = null;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.startsWith('image/')) { imageItem = items[i]; break; }
        }
        if (!imageItem) {
          for (let i = 0; i < items.length; i++) {
            if (items[i].kind === 'file' && items[i].type.startsWith('image/')) { imageItem = items[i]; break; }
          }
        }
        if (!imageItem) { alert('Tidak ada gambar di clipboard.'); return; }
        const file = imageItem.getAsFile ? imageItem.getAsFile() : null;
        if (!file) { alert('Gagal ambil gambar.'); return; }
        const reader = new FileReader();
        reader.onload = function(ev) {
          const dataURL = ev.target.result;
          if (isPrimary) setPrimaryImage(dataURL, '📋 paste');
          else setSecondaryImage(dataURL, '📋 paste');
        };
        reader.onerror = function() { alert('Gagal proses paste.'); };
        reader.readAsDataURL(file);
        e.preventDefault();
        return false;
      });
    }

    setupPaste(document.getElementById('primaryItem'), true);
    setupPaste(document.getElementById('secondaryItem'), false);

    resetBtn.addEventListener('click', function() {
      primaryDataURL = null; secondaryDataURL = null;
      primaryImg.style.display = 'none'; secondaryImg.style.display = 'none';
      primaryImg.src = ''; secondaryImg.src = '';
      primaryFileName.textContent = 'kosong'; secondaryFileName.textContent = 'kosong';
      placeholderText.style.display = 'block';
      primaryInput.value = ''; secondaryInput.value = '';
      pasteStatusPrimary.textContent = 'siap'; pasteStatusPrimary.className = 'paste-status';
      pasteStatusSecondary.textContent = 'siap'; pasteStatusSecondary.className = 'paste-status';
    });

    function downloadStory() {
      if (!primaryDataURL) { alert('Upload atau paste gambar utama (9:16)'); return; }
      const canvasWidth = 540, canvasHeight = 960;
      const canvas = document.createElement('canvas');
      canvas.width = canvasWidth; canvas.height = canvasHeight;
      const ctx = canvas.getContext('2d');

      const primary = new Image(); primary.crossOrigin = 'anonymous'; primary.src = primaryDataURL;
      const secondary = new Image(); secondary.crossOrigin = 'anonymous'; 
      if (secondaryDataURL) secondary.src = secondaryDataURL;

      let primaryLoaded = false, secondaryLoaded = !secondaryDataURL;

      function checkAndDraw() {
        if (!primaryLoaded) return;
        if (secondaryDataURL && !secondaryLoaded) return;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        const pAspect = primary.width / primary.height;
        const canvasAspect = canvasWidth / canvasHeight;
        let sx = 0, sy = 0, sw = primary.width, sh = primary.height;
        if (pAspect > canvasAspect) {
          const scale = canvasHeight / primary.height;
          const cropWidth = canvasWidth / scale;
          sx = (primary.width - cropWidth) / 2; sw = cropWidth;
        } else {
          const scale = canvasWidth / primary.width;
          const cropHeight = canvasHeight / scale;
          sy = (primary.height - cropHeight) / 2; sh = cropHeight;
        }
        ctx.drawImage(primary, sx, sy, sw, sh, 0, 0, canvasWidth, canvasHeight);

        if (secondaryDataURL && secondaryLoaded) {
          const maxWidth = canvasWidth * 0.66, maxHeight = canvasHeight * 0.42;
          let sWidth = secondary.width, sHeight = secondary.height;
          let scale = 1;
          if (sWidth > maxWidth) scale = maxWidth / sWidth;
          if (sHeight * scale > maxHeight) scale = Math.min(scale, maxHeight / sHeight);
          const finalWidth = sWidth * scale, finalHeight = sHeight * scale;
          const x = (canvasWidth - finalWidth) / 2, y = canvasHeight * 0.14;
          ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
          ctx.drawImage(secondary, x, y, finalWidth, finalHeight);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1.5;
          ctx.strokeRect(x, y, finalWidth, finalHeight);
        }

        const link = document.createElement('a');
        link.download = 'story-compose.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      primary.onload = function() { primaryLoaded = true; checkAndDraw(); };
      primary.onerror = function() { alert('Gagal memuat gambar utama.'); };
      if (secondaryDataURL) {
        secondary.onload = function() { secondaryLoaded = true; checkAndDraw(); };
        secondary.onerror = function() { secondaryLoaded = true; checkAndDraw(); };
      } else secondaryLoaded = true;

      if (primary.complete && primary.naturalWidth !== 0) { primaryLoaded = true; checkAndDraw(); }
      if (secondaryDataURL && secondary.complete && secondary.naturalWidth !== 0) { secondaryLoaded = true; checkAndDraw(); }
    }

    // SHARE WA
    function shareWA() {
      if (!primaryDataURL) {
        alert('Upload atau paste gambar utama (9:16) dulu ya!');
        return;
      }

      // Buat canvas untuk preview
      const canvasWidth = 540, canvasHeight = 960;
      const canvas = document.createElement('canvas');
      canvas.width = canvasWidth; canvas.height = canvasHeight;
      const ctx = canvas.getContext('2d');

      const primary = new Image();
      primary.crossOrigin = 'anonymous';
      primary.src = primaryDataURL;

      const secondary = new Image();
      secondary.crossOrigin = 'anonymous';
      if (secondaryDataURL) secondary.src = secondaryDataURL;

      let primaryLoaded = false;
      let secondaryLoaded = !secondaryDataURL;

      function processShare() {
        if (!primaryLoaded) return;
        if (secondaryDataURL && !secondaryLoaded) return;

        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        const pAspect = primary.width / primary.height;
        const canvasAspect = canvasWidth / canvasHeight;
        let sx = 0, sy = 0, sw = primary.width, sh = primary.height;
        if (pAspect > canvasAspect) {
          const scale = canvasHeight / primary.height;
          const cropWidth = canvasWidth / scale;
          sx = (primary.width - cropWidth) / 2;
          sw = cropWidth;
        } else {
          const scale = canvasWidth / primary.width;
          const cropHeight = canvasHeight / scale;
          sy = (primary.height - cropHeight) / 2;
          sh = cropHeight;
        }
        ctx.drawImage(primary, sx, sy, sw, sh, 0, 0, canvasWidth, canvasHeight);

        if (secondaryDataURL && secondaryLoaded) {
          const maxWidth = canvasWidth * 0.66, maxHeight = canvasHeight * 0.42;
          let sWidth = secondary.width, sHeight = secondary.height;
          let scale = 1;
          if (sWidth > maxWidth) scale = maxWidth / sWidth;
          if (sHeight * scale > maxHeight) scale = Math.min(scale, maxHeight / sHeight);
          const finalWidth = sWidth * scale, finalHeight = sHeight * scale;
          const x = (canvasWidth - finalWidth) / 2, y = canvasHeight * 0.14;
          ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
          ctx.drawImage(secondary, x, y, finalWidth, finalHeight);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1.5;
          ctx.strokeRect(x, y, finalWidth, finalHeight);
        }

        // Convert ke data URL
        const imageDataURL = canvas.toDataURL('image/png');

        // Buat link WhatsApp dengan gambar
        const waUrl = `https://wa.me/${WA_NUMBER}?text=Halo%20kak%2C%20saya%20mau%20share%20story%20nih!%20%F0%9F%98%8A%0A%0A*Link%20Story%3A*%20${encodeURIComponent(imageDataURL)}`;

        window.open(waUrl, '_blank');
      }

      primary.onload = function() { primaryLoaded = true; processShare(); };
      primary.onerror = function() { alert('Gagal memuat gambar utama.'); };

      if (secondaryDataURL) {
        secondary.onload = function() { secondaryLoaded = true; processShare(); };
        secondary.onerror = function() { secondaryLoaded = true; processShare(); };
      } else {
        secondaryLoaded = true;
      }

      if (primary.complete && primary.naturalWidth !== 0) {
        primaryLoaded = true;
        processShare();
      }
      if (secondaryDataURL && secondary.complete && secondary.naturalWidth !== 0) {
        secondaryLoaded = true;
        processShare();
      }
    }

    downloadBtn.addEventListener('click', downloadStory);
    shareWaBtn.addEventListener('click', shareWA);
    updatePreview();
  })();
</script>
</body>
</html>
